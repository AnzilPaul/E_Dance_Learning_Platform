<!DOCTYPE html>
<html>
    <head>
        <title></title>
    </head>
<body>
    <center>
<h2>{{ title }}</h2>
{% if messages %}
    {% for message in messages %}
        <p style="color:red;">{{ message }}</p>
    {% endfor %}
{% endif %}


<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
</form>
</center>
</body>
</html>
